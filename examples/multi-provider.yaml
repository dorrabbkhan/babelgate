# One endpoint, three providers: local Ollama by default, OpenRouter and
# Anthropic by model name, plus short aliases.
#
#   OPENROUTER_API_KEY=<key> ANTHROPIC_API_KEY=<key> \
#     npx babelgate --config examples/multi-provider.yaml
#
# Model resolution order: explicit <provider>/<model> in the request,
# then aliases, then routes in order, then the default provider
# (model unchanged). Replies keep the name the client asked for.
default: ollama
providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434
  openrouter:
    type: openai
    # No /v1: babelgate appends /v1/chat/completions and /v1/models itself.
    base_url: https://openrouter.ai/api
    api_key_env: OPENROUTER_API_KEY
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
aliases:
  fast: ollama/qwen2.5-coder:7b        # request model "fast"
  smart: anthropic/claude-sonnet-4-5   # request model "smart"
routes:
  - match: claude-*
    to: anthropic/claude-sonnet-4-5
    fallback:
      - openrouter/anthropic/claude-sonnet-4.5   # OpenRouter catalog id
  - match: gemini-*
    to: openrouter/google/gemini-3-flash-preview
  - match: gpt-*
    to: openrouter/openai/gpt-5-mini
