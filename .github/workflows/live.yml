name: Live

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Skip on the Monday replay cron: client-replay runs then instead,
    # and the paid live suite must not run twice on Mondays.
    if: github.event.schedule != '0 6 * * 1'
    runs-on: ubuntu-latest
    env:
      LIVE_OLLAMA_MODEL: qwen2.5:0.5b
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
        volumes:
          # /home/runner is the ubuntu-latest runner's home. The bind mount
          # lives outside the workspace so actions/checkout can never clean
          # or replace it.
          - /home/runner/.ollama-models:/root/.ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare the Ollama model cache dir
        # Docker created the bind-mount dir as root when the service started;
        # actions/cache restores as `runner`, so it needs ownership first.
        run: sudo mkdir -p /home/runner/.ollama-models && sudo chown -R "$USER" /home/runner/.ollama-models
      # Restoring the cache after the service has started is fine: Ollama
      # reads model files at request time from /root/.ollama/models, which is
      # this same bind-mounted directory.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama-models
          key: ollama-models-${{ env.LIVE_OLLAMA_MODEL }}
      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && exit 0
            sleep 2
          done
          echo "Ollama service did not become ready" >&2
          exit 1
      - name: Pull the live model
        run: docker exec ${{ job.services.ollama.id }} ollama pull ${{ env.LIVE_OLLAMA_MODEL }}
      - run: npm ci
      - name: Run the live suite
        env:
          OLLAMA_API_BASE_URL: http://localhost:11434
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:live
      - name: Restore model cache ownership
        if: always()
        # The container writes the pulled model as root; the post-job cache
        # save runs as `runner` and must be able to read every file.
        run: sudo chown -R "$USER" /home/runner/.ollama-models

  # Weekly (Mon 06:00 UTC) client-release replay (v1.5 spec §3.4): the
  # latest Claude Code and Codex releases run the edit-task gates
  # through babelgate on a cheap OpenRouter model and their request
  # shapes are diffed against the committed recording fixtures. Any
  # failure or added shape opens a `client-replay` issue — a new
  # client release can change its wire shape without breaking the
  # edit task, and the compatibility matrix's badge reads this job's
  # schedule runs. workflow_dispatch is included so the job can be
  # verified after the patch lands without waiting for Monday.
  client-replay:
    if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay the latest client releases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: scripts/gates/client-replay.sh
      - name: Upload the replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-replay-${{ github.run_id }}
          path: tmp/client-replay/
          retention-days: 14
      - name: Open a client-replay issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create client-replay \
            --description "Weekly client-release replay failures" \
            --color BFD4F2 --force
          mkdir -p tmp/client-replay
          summary=tmp/client-replay/summary.md
          if [ ! -f "$summary" ]; then
            echo "client-replay.sh exited before writing a summary — see the job log." > "$summary"
          fi
          # One issue per label: an open client-replay issue gets a
          # comment per failing run instead of a silent skip; new
          # issue bodies and comments both carry the run URL.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=tmp/client-replay/issue-body.md
          { cat "$summary"; echo; echo "replay run: $run_url"; } > "$body"
          issue="$(gh issue list --label client-replay --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --label client-replay \
              --title "Client replay failed: $(cat tmp/client-replay/versions.txt 2>/dev/null || echo 'versions unknown')" \
              --body-file "$body"
          fi
