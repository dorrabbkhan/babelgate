<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>babelgate</title>
    <style>
      :root {
        --bg: #0f1216;
        --panel: #171c23;
        --border: #2a323d;
        --text: #d7dde4;
        --muted: #8b96a3;
        --accent: #5aa2ff;
        --added: #1f4d2e;
        --removed: #5a2326;
        --changed: #5a4a1f;
        --ok: #7fd08a;
        --err: #e07a7a;
        --warn: #d8b45a;
        --json-key: #9ecbff;
        --json-str: #a8d8a8;
        --json-num: #e0b070;
        --json-lit: #c792ea;
        --series-1: #5aa2ff;
        --series-2: #7fd08a;
        --series-3: #e0b070;
        --series-4: #c792ea;
        --series-5: #e07a7a;
        --series-6: #6fd0d0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fa;
          --panel: #ffffff;
          --border: #d0d7de;
          --text: #1f2328;
          --muted: #59636e;
          --accent: #0969da;
          --added: #ccf0d8;
          --removed: #ffd7d3;
          --changed: #fff1b8;
          --ok: #1a7f37;
          --err: #cf222e;
          --warn: #9a6700;
          --json-key: #0550ae;
          --json-str: #116329;
          --json-num: #953800;
          --json-lit: #8250df;
          --series-1: #0969da;
          --series-2: #1a7f37;
          --series-3: #9a6700;
          --series-4: #8250df;
          --series-5: #cf222e;
          --series-6: #0a7ea4;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      a { color: var(--accent); text-decoration: none; }
      header {
        display: flex;
        gap: 16px;
        align-items: baseline;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      header .brand { font-weight: 700; }
      main { padding: 16px; }
      table { border-collapse: collapse; width: 100%; }
      th, td {
        text-align: left;
        padding: 4px 10px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th { color: var(--muted); font-weight: 600; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: var(--panel); }
      .filters { display: flex; gap: 8px; margin-bottom: 12px; }
      .filters input, .filters select, .prompt input {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      .badge {
        display: inline-block;
        padding: 0 6px;
        border-radius: 8px;
        background: var(--changed);
        font-size: 12px;
      }
      .status-ok { color: var(--ok); }
      .status-error { color: var(--err); }
      .status-aborted { color: var(--warn); }
      .status-running { color: var(--muted); }
      .inspector-notes, .inspector-meta {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 12px;
      }
      .stages { display: flex; gap: 12px; align-items: flex-start; }
      .stage {
        flex: 1;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        overflow: auto;
        max-height: 75vh;
      }
      .stage h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
      .stage .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
      .stage .tabs button.active { border-color: var(--accent); color: var(--accent); }
      .json-tree { font-size: 13px; }
      .json-tree .row { padding-left: 14px; white-space: pre-wrap; word-break: break-all; }
      .json-tree .twisty { cursor: pointer; color: var(--muted); user-select: none; }
      .json-tree .key { color: var(--json-key); }
      .json-tree .str { color: var(--json-str); }
      .json-tree .num { color: var(--json-num); }
      .json-tree .lit { color: var(--json-lit); }
      .json-tree .hl-added { background: var(--added); }
      .json-tree .hl-removed { background: var(--removed); }
      .json-tree .hl-changed { background: var(--changed); }
      .removed-list { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .prompt { max-width: 520px; margin: 48px auto; }
      .error { color: var(--err); }
      .muted { color: var(--muted); }
      h2 { font-size: 15px; margin: 18px 0 8px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 12px;
      }
      .panel h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
      .usage-totals { display: flex; gap: 20px; flex-wrap: wrap; }
      svg.chart { width: 100%; height: auto; display: block; }
      /* HTML label strip: fixed 12px (the legend's size) at any width;
         spans are centred on their `left` unless the chart overrides
         transform (line-chart edge labels) */
      .axis-labels {
        position: relative;
        height: 16px;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }
      .axis-labels > span {
        position: absolute;
        top: 0;
        white-space: nowrap;
        transform: translateX(-50%);
      }
      .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
      .legend .sw {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        font-style: normal;
      }
      header a.active { color: var(--text); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
